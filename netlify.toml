# Publish only the frontend (not backend/ or docs).
[build]
  command = "rm -rf dist && mkdir dist && cp -r index.html css js dist/"
  publish = "dist"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"

# Always fetch fresh app code so crews get updates (e.g. a new API_URL) right away.
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "no-cache"
